[package]
name = "acvus-interpreter"
version = "0.1.0"
edition = "2024"
license-file.workspace = true

[features]
default = []
chain-alphabet-add-sub-mul = []
# The unchecked index handler, which no MIR instruction produces: a probe
# substitutes it into a prepared body to price the bound check (RFC-0047).
probe = []
# The runtime's own tooling route (RFC-0090 rule 6): the raw values a run
# assigned, drained by key (`Interpreter::take_writes`, `ContextWrite`). The
# tooling reads them by the settled type: the CLI, which declares `!`, and
# this workspace's tests. A host does not turn it on; it reads a run's
# writes through its page's typed methods.
tooling = []

[dependencies]
acvus-ast = { path = "../acvus-ast" }
acvus-utils = { path = "../acvus-utils" }
acvus-mir = { path = "../acvus-mir" }
acvus-extern = { path = "../acvus-extern" }
futures = "0.3"
parking_lot = "0.12"
rust_decimal = "1.40.0"
rustc-hash = { workspace = true }
smallvec = "1"
stackfuture = "0.3"
sync_wrapper = "1"
uuid = { workspace = true }
tracing = "0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
blake3 = "1"
trait-variant = "0.1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
