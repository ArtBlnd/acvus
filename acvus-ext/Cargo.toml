[package]
name = "acvus-ext"
version = "0.1.0"
edition = "2024"
# `tests/all.rs` names every file under `tests/` as a module, so this crate
# links one test binary instead of one per file. Linking, not compiling, is
# the cost a workspace test run is made of: sccache caches compilation, and
# the 203 binaries of the run before this one held 25 GB of `debug/deps`
# (measured 2026-09-21).
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
acvus-extern = { path = "../acvus-extern" }
acvus-mir = { path = "../acvus-mir" }
acvus-utils = { path = "../acvus-utils" }
futures = "0.3"
sync_wrapper = "1"
rustc-hash = { workspace = true }
regex = "1"
chrono = "0.4"
base64 = "0.22"
percent-encoding = "2"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
acvus-interpreter = { path = "../acvus-interpreter" }
acvus-ast = { path = "../acvus-ast" }
tokio = { version = "1", features = ["macros", "rt"] }

[[bench]]
name = "iter_cost"
harness = false
