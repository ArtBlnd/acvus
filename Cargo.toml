[workspace]
resolver = "3"
members = [
    "acvus-utils",
    "acvus-interpreter",
    "acvus-interpreter-test",
    "acvus-ast",
    "acvus-mir",
    "acvus-cli",
    "acvus-mir-test",
    "acvus-ext",
    "acvus-ext-net",
    "acvus-lsp",
    "acvus-extern",
    "acvus-extern-macro",
]

[workspace.package]
# The Acvus License (`LICENSE`) has no SPDX identifier, so crates name the
# file rather than a `license` expression.
license-file = "LICENSE"

# RFC-0080 rule 5: a cast is its crate's boundary module's. Each boundary
# module (`acvus_extern::repr`, the interpreter's `repr`) allows
# `disallowed_methods` for itself; `clippy.toml` names the methods, and
# `acvus-interpreter-test`'s `repr_boundary` scans every source, the crates
# that do not take these lints included.
[workspace.lints.clippy]
disallowed_methods = "deny"
ptr_as_ptr = "deny"
ref_as_ptr = "deny"
ptr_cast_constness = "deny"
cast_ptr_alignment = "deny"
transmute_ptr_to_ptr = "deny"

[workspace.dependencies]
rustc-hash = "2"
uuid = { version = "1", features = ["v4", "js"] }

# Line tables only: a backtrace keeps its file and line, and the type and
# variable records that made a test binary ~40 % debuginfo (measured
# 2026-09-20: .debug_str 119 MB + .debug_info 78 MB of 534 MB) are not
# emitted. A debugger session that needs them builds with
# CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

[profile.wasm]
inherits = "release"
opt-level = 'z'
