[package]
name = "acvus-extern-macro"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }

[dev-dependencies]
acvus-extern = { path = "../acvus-extern" }
acvus-ext = { path = "../acvus-ext" }
trybuild = "1.0.121"
