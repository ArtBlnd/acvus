[package]
name = "acvus-interpreter-test"
version = "0.1.0"
edition = "2024"
license-file.workspace = true
# `tests/all.rs` names every file under `tests/` as a module, so this crate
# links one test binary instead of one per file. Linking, not compiling, is
# the cost a workspace test run is made of: sccache caches compilation, and
# the 203 binaries of the run before this one held 25 GB of `debug/deps`
# (measured 2026-09-21).
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
acvus-ast = { path = "../acvus-ast" }
acvus-mir = { path = "../acvus-mir" }
acvus-utils = { path = "../acvus-utils" }
acvus-interpreter = { path = "../acvus-interpreter", features = ["probe", "tooling"] }
acvus-extern = { path = "../acvus-extern" }
acvus-ext = { path = "../acvus-ext" }
rustc-hash = { workspace = true }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
libtest-mimic = "0.8"
glob = "0.3"
futures = "0.3"

# A process has one global allocator, and these three count through it:
# a run's allocations are what they assert. Sharing a binary with tests
# that allocate on other threads would make the count somebody else's.
[[test]]
name = "aggregate_result_allocates_nothing"
path = "tests/aggregate_result_allocates_nothing.rs"

[[test]]
name = "nested_exit_drops"
path = "tests/nested_exit_drops.rs"

[[test]]
name = "run_allocations"
path = "tests/run_allocations.rs"

[[test]]
name = "view_allocates_nothing"
path = "tests/view_allocates_nothing.rs"

[[test]]
name = "host_lend_allocates_nothing"
path = "tests/host_lend_allocates_nothing.rs"

# Its allocator overwrites every freed block, so a read of released cells
# answers the fill pattern; no other test should pay for that.
[[test]]
name = "run_dropped_in_flight"
path = "tests/run_dropped_in_flight.rs"

# Its bounds are wall-clock durations, which the parallel tests of `all`
# would stretch.
[[test]]
name = "sleep"
path = "tests/sleep.rs"

[[test]]
name = "fixtures"
harness = false

[[bench]]
name = "attention"
harness = false

[[bench]]
name = "accum"
harness = false

[[bench]]
name = "mandelbrot"
harness = false

[[bench]]
name = "slice_ceiling"
harness = false

[[bench]]
name = "shapes"
harness = false

[[bench]]
name = "programs"
harness = false

[[bench]]
name = "asm_probe"
harness = false

[[bench]]
name = "spawn"
harness = false

[[bench]]
name = "logs"
harness = false
