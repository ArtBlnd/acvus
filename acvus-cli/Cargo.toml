[package]
name = "acvus-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "acvus"
path = "src/main.rs"

[dependencies]
acvus-ast = { path = "../acvus-ast" }
acvus-ext = { path = "../acvus-ext" }
acvus-ext-llm = { path = "../acvus-ext-llm" }
acvus-ext-net = { path = "../acvus-ext-net" }
acvus-extern = { path = "../acvus-extern" }
acvus-interpreter = { path = "../acvus-interpreter" }
acvus-mir = { path = "../acvus-mir" }
acvus-utils = { path = "../acvus-utils" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustc-hash = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
