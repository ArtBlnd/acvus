[package]
name = "acvus-cli"
version = "0.1.0"
edition = "2024"
# `tests/all.rs` names every file under `tests/` as a module, so this crate
# links one test binary instead of one per file. Linking, not compiling, is
# the cost a workspace test run is made of: sccache caches compilation, and
# the 203 binaries of the run before this one held 25 GB of `debug/deps`
# (measured 2026-09-21).
autotests = false

[[bin]]
name = "acvus"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
acvus-ast = { path = "../acvus-ast" }
acvus-ext = { path = "../acvus-ext" }
acvus-ext-net = { path = "../acvus-ext-net" }
acvus-extern = { path = "../acvus-extern" }
# `probe` carries `Op::successor`, `Op::owns` and `Named::name`, which the
# `ops` command's listing walks; a release build without it has no listing.
acvus-interpreter = { path = "../acvus-interpreter", features = ["probe"] }
acvus-mir = { path = "../acvus-mir" }
acvus-utils = { path = "../acvus-utils" }
rustc-hash = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# The other compile path onto the same walk: `ops` output is asserted against
# the listing the interpreter's tests read.
acvus-interpreter-test = { path = "../acvus-interpreter-test" }
